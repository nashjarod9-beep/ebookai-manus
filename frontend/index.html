<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EbookAI - Créez votre ebook avec l'IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color: #e11d48; padding: 32px; background: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999; overflow: auto; line-height: 1.6;">' +
            '<h2 style="margin-top: 0; font-size: 20px; border-bottom: 2px solid #fecdd3; padding-bottom: 12px; color: #9f1239;">🚨 Erreur d\'exécution détectée</h2>' +
            '<p style="font-weight: bold; font-size: 16px;">' + message + '</p>' +
            '<p style="color: #64748b;">Fichier : ' + source + ' (Ligne ' + lineno + ' col ' + colno + ')</p>' +
            '<pre style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; rounded: 8px; overflow: auto; max-width: 100%; white-space: pre-wrap; font-size: 12px; color: #334155;">' + (error && error.stack ? error.stack : 'Pas de stack trace disponible') + '</pre>' +
            '<p style="margin-top: 24px; font-size: 12px; color: #94a3b8;">Neno AI Debugger</p>' +
            '</div>';
        }
      };
      window.onunhandledrejection = function(event) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="color: #e11d48; padding: 32px; background: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999; overflow: auto; line-height: 1.6;">' +
            '<h2 style="margin-top: 0; font-size: 20px; border-bottom: 2px solid #fecdd3; padding-bottom: 12px; color: #9f1239;">🚨 Rejet de promesse non géré</h2>' +
            '<p style="font-weight: bold; font-size: 16px;">' + event.reason + '</p>' +
            '<pre style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; rounded: 8px; overflow: auto; max-width: 100%; white-space: pre-wrap; font-size: 12px; color: #334155;">' + (event.reason && event.reason.stack ? event.reason.stack : 'Pas de stack trace disponible') + '</pre>' +
            '<p style="margin-top: 24px; font-size: 12px; color: #94a3b8;">Neno AI Debugger</p>' +
            '</div>';
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
